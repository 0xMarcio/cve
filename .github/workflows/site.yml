name: Build & Deploy PoC Index

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build site data
        run: python3 scripts/build_site.py

      - name: Build per-CVE pages
        run: python3 scripts/build_pages.py

      - name: Build robots.txt and sitemaps
        run: python3 scripts/build_seo.py

      - name: Verify published counts
        run: |
          python3 .github/hero.py
          python3 .github/getTrending.py --counts-only
          git diff --exit-code -- \
            README.md \
            docs/hero.svg \
            docs/social-card.svg \
            docs/stats.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
