name: Pacemaker

# GitHub's cron scheduler creates this repository's scheduled runs four to
# five hours late and drops the slots in between, so the hourly refresh cannot
# come from a cron. A workflow_dispatch call creates a run within seconds, so
# each pacemaker run sleeps until the next :05, fires the Hot CVEs refresh and
# its own successor, and the chain keeps time by itself. The cron below only
# restarts the chain if a link ever fails; while the chain is alive the
# concurrency group holds the extra run back and the next link cancels it.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  actions: write

concurrency:
  group: pacemaker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Sleep until the next :05, then fire the hourly refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%s)
          next=$(( now / 3600 * 3600 + 300 ))
          [ "$next" -gt "$now" ] || next=$(( next + 3600 ))
          echo "Sleeping $(( (next - now) / 60 )) minutes until $(date -u -d @"$next" +%H:%M) UTC"
          sleep $(( next - now ))
          gh workflow run hot_cves.yml -R "$GITHUB_REPOSITORY" --ref main
          gh workflow run pacemaker.yml -R "$GITHUB_REPOSITORY" --ref main
