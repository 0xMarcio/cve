name: Audit PoC Links

on:
  schedule:
    - cron: '40 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-updates
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # A quarter of the repositories and a fifth of the reference links each
      # week: about nine minutes of GraphQL and, at a measured 15 URLs a
      # second, thirteen of HTTP. Everything is swept within five weeks.
      - name: Drop dead links and refresh repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/audit_poc_links.py --limit 12000 --references 12000

      - name: Check for changes and commit
        run: |
          git config user.name 'CVE-BOT'
          git config user.email 'cve@codepwn.win'

          git add --all -- \
            .github/link_audit_state.json \
            github.txt \
            repo_meta.json \
            kev.json \
            references.txt \
            ':(top,glob)[12][0-9][0-9][0-9]/CVE-*.md'

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Drop PoC links to deleted repositories $(date -u +'%Y-%m-%d')"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected; replaying onto the current main (attempt $attempt)"
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git rebase FETCH_HEAD
          done
          exit 1
