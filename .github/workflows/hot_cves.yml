name: Hot CVEs List

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: repository-updates
  cancel-in-progress: false

jobs:
  ScheduledRun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Redraw the banner and recount the index
        run: |
          # Counts the corpus with the site build's own parser, so the banner can
          # never disagree with the site, and drops the figures in docs/stats.json
          # for the README badges to quote.
          python3 .github/hero.py
          # og:image has to be a raster: Twitter, Slack and Discord all ignore SVG
          sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null
          rsvg-convert -w 1280 -h 640 docs/social-card.svg -o docs/social-card.png

      - name: Rebuild the trending PoC table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/getTrending.py

      - name: Check for changes and commit
        run: |
          git config user.name 'CVE-BOT'
          git config user.email 'cve@codepwn.win'
          git add -- README.md trending.json docs/hero.svg docs/social-card.svg docs/social-card.png docs/stats.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Trending CVEs update $(date -u +'%Y-%m-%d %H:%M') :robot:"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected; replaying onto the current main (attempt $attempt)"
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git rebase FETCH_HEAD
          done
          exit 1
