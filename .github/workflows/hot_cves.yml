name: Hot CVEs List

# The hourly trigger is a systemd timer on the VPS calling workflow_dispatch:
# GitHub's own scheduler creates cron runs four to five hours late and drops
# the slots in between. The cron below is the fallback and the watchdog. It
# yields while the trigger is alive, takes over when it is not, and fails
# loudly once the trigger has been dead for three hours so the failure email
# says why.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: repository-updates
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Yield to the hourly trigger while it is alive
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits?per_page=30" \
            --jq 'map(select(.commit.message | startswith("Trending CVEs update")))[0].commit.committer.date')
          age=$(( $(date -u +%s) - $(date -u -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "Last trending refresh: ${last:-none}, $((age / 60)) minutes ago"
          if [ "$age" -lt 3300 ]; then
            echo "Fresh enough, the hourly trigger is doing its job"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$age" -gt 10800 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

  ScheduledRun:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Ingest the previous hour's candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_pocingithub.py --input index/trending.json

      - name: Redraw the banner and recount the index
        run: |
          # Counts the corpus with the site build's own parser, so the banner can
          # never disagree with the site, and drops the figures in docs/stats.json
          # for the README badges to quote.
          python3 .github/hero.py
          # og:image has to be a raster: Twitter, Slack and Discord all ignore SVG
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null
          rsvg-convert -w 1280 -h 640 docs/social-card.svg -o docs/social-card.png

      - name: Rebuild the trending PoC table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/getTrending.py

      - name: Check for changes and commit
        id: commit
        run: |
          git config user.name 'CVE-BOT'
          git config user.email 'bot@pocindex.io'
          git add --all -- \
            README.md \
            index/trending.json \
            index/github.txt \
            index/cve_dates.json \
            index/cve_record_state.json \
            docs/hero.svg \
            docs/social-card.svg \
            docs/social-card.png \
            docs/stats.json \
            docs/kev.svg \
            cves/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Trending CVEs update $(date -u +'%Y-%m-%d %H:%M') :robot:"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected; replaying onto the current main (attempt $attempt)"
            git fetch --unshallow origin main 2>/dev/null || git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
          done
          exit 1

      # Commits pushed with the workflow token raise no push event, so site.yml
      # would otherwise wait for its daily schedule. Dispatching is exempt.
      - name: Rebuild and deploy the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main

      - name: Fail loudly when the hourly trigger is dead
        if: needs.gate.outputs.stale == 'true'
        run: |
          echo "::error::No trending refresh for over three hours: the external hourly trigger is not firing"
          exit 1
