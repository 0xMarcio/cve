name: Hot CVEs List

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: repository-updates
  cancel-in-progress: false

jobs:
  ScheduledRun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Rebuild the trending PoC table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/getTrending.py

      - name: Check for changes and commit
        run: |
          git config user.name 'CVE-BOT'
          git config user.email 'cve@codepwn.win'
          git add -- README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Trending CVEs update $(date -u +'%Y-%m-%d %H:%M') :robot:"
            git push origin HEAD:main
          fi
